# MySQL with a learning database, `shop`, and phpMyAdmin in front of it, already signed in.
#
# The lab's page offers phpMyAdmin as a link (lab.open). The database itself is reached
# from the terminal as `mariadb -h db -u student -pstudent shop`, once ~/.my.cnf
# says to accept the server's own certificate (the README's first step).

services:
  db:
    image: mysql:8.4
    environment:
      # A lab's copy is private to one student and nothing outside it can reach port 3306,
      # so these are written down rather than kept secret.
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
      MYSQL_USER: student
      MYSQL_PASSWORD: student
    # Two files are written where the image runs SQL the first time it starts, then the
    # last line hands over to the image's own entrypoint. A file of its own would need a
    # bind mount, which a lab may not have, so the SQL is written out here.
    #
    # shop.sql is the learning database: categories, suppliers, products, customers,
    # employees, orders, order_items and reviews. It is made by seed/make.py and put here
    # by seed/splice.py, so change that rather than editing it by hand.
    #
    # student.sql: the image makes `student` the owner of `shop` and nothing else, which
    # phpMyAdmin reports as "No privileges to create databases", so every database named
    # student_<anything> is theirs too.
    entrypoint:
      - sh
      - -c
      - |
        cat > /docker-entrypoint-initdb.d/shop.sql <<'SQL'
        USE shop;



        CREATE TABLE categories (
          id INT AUTO_INCREMENT PRIMARY KEY,
          name VARCHAR(40) NOT NULL UNIQUE,
          description VARCHAR(200)
        );
        CREATE TABLE suppliers (
          id INT AUTO_INCREMENT PRIMARY KEY,
          name VARCHAR(80) NOT NULL,
          city VARCHAR(60) NOT NULL,
          country VARCHAR(60) NOT NULL
        );
        CREATE TABLE products (
          id INT AUTO_INCREMENT PRIMARY KEY,
          name VARCHAR(100) NOT NULL,
          category_id INT NULL,
          supplier_id INT NOT NULL,
          price DECIMAL(8,2) NOT NULL CHECK (price >= 0),
          stock INT NOT NULL DEFAULT 0,
          discontinued BOOLEAN NOT NULL DEFAULT FALSE,
          FOREIGN KEY (category_id) REFERENCES categories(id),
          FOREIGN KEY (supplier_id) REFERENCES suppliers(id)
        );
        CREATE TABLE employees (
          id INT AUTO_INCREMENT PRIMARY KEY,
          first_name VARCHAR(40) NOT NULL,
          last_name VARCHAR(40) NOT NULL,
          job_title VARCHAR(60) NOT NULL,
          manager_id INT NULL,
          hired_on DATE NOT NULL,
          salary INT NOT NULL,
          FOREIGN KEY (manager_id) REFERENCES employees(id)
        );
        CREATE TABLE customers (
          id INT AUTO_INCREMENT PRIMARY KEY,
          first_name VARCHAR(40) NOT NULL,
          last_name VARCHAR(40) NOT NULL,
          email VARCHAR(120) NOT NULL UNIQUE,
          phone VARCHAR(20) NULL,
          city VARCHAR(60) NOT NULL,
          country VARCHAR(60) NOT NULL,
          joined_on DATE NOT NULL
        );
        CREATE TABLE orders (
          id INT AUTO_INCREMENT PRIMARY KEY,
          customer_id INT NOT NULL,
          employee_id INT NOT NULL,
          ordered_at DATETIME NOT NULL,
          status ENUM('pending', 'shipped', 'delivered', 'cancelled') NOT NULL,
          shipped_on DATE NULL,
          FOREIGN KEY (customer_id) REFERENCES customers(id),
          FOREIGN KEY (employee_id) REFERENCES employees(id)
        );
        CREATE TABLE order_items (
          order_id INT NOT NULL,
          product_id INT NOT NULL,
          quantity INT NOT NULL CHECK (quantity > 0),
          unit_price DECIMAL(8,2) NOT NULL,
          PRIMARY KEY (order_id, product_id),
          FOREIGN KEY (order_id) REFERENCES orders(id),
          FOREIGN KEY (product_id) REFERENCES products(id)
        );
        CREATE TABLE reviews (
          id INT AUTO_INCREMENT PRIMARY KEY,
          product_id INT NOT NULL,
          customer_id INT NOT NULL,
          stars TINYINT NOT NULL CHECK (stars BETWEEN 1 AND 5),
          comment VARCHAR(200) NULL,
          reviewed_on DATE NOT NULL,
          UNIQUE (product_id, customer_id),
          FOREIGN KEY (product_id) REFERENCES products(id),
          FOREIGN KEY (customer_id) REFERENCES customers(id)
        );



