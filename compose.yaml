# MySQL with phpMyAdmin in front of it, already signed in.
#
# The lab's page offers phpMyAdmin as a link (lab.open). The database itself is reached
# from the terminal as `mariadb -h db -u student -pstudent shop`, once ~/.my.cnf
# says to accept the server's own certificate (the README's first step).

services:
  db:
    image: mysql:8.4
    environment:
      # A lab's copy is private to one student and nothing outside it can reach port 3306,
      # so these are written down rather than kept secret.
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
      MYSQL_USER: student
      MYSQL_PASSWORD: student
    command:
      # A lab's volumes are saved only while they total under 200 MB, and MySQL's defaults
      # (a 100 MB redo log among them) would use most of that before any data went in.
      - --innodb-redo-log-capacity=8M
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      # Nothing replicates from a lab, and a binary log grows with every write.
      - --disable-log-bin
      # The terminal's client is MariaDB's, which has no plugin for MySQL 8.4's default
      # sign-in method, caching_sha2_password. This is the older one, still over TLS.
      - --mysql-native-password=ON
      - --authentication-policy=mysql_native_password
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ustudent", "-pstudent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      lab.title: "MySQL"

  phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: db
      # Signing phpMyAdmin in as the student means the page opens on the database
      # rather than on a login form.
      PMA_USER: student
      PMA_PASSWORD: student
      APACHE_PORT: "8080"
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      lab.title: "phpMyAdmin"
      lab.open: "8080"

volumes:
  mysqldata:
